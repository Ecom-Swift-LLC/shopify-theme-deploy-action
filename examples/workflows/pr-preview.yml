name: PR theme preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push preview theme
        id: preview
        uses: Ecom-Swift-LLC/shopify-theme-deploy-action@v1
        with:
          mode: preview
          store: ${{ secrets.SHOPIFY_STORE }}
          theme-token: ${{ secrets.SHOPIFY_THEME_TOKEN }}
          context: pr-${{ github.event.pull_request.number }}
          path: theme

      # Pushing again on new commits reuses the same theme (same `context`),
      # so this comment updates in place instead of piling up.
      - name: Comment the preview link on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- shopify-theme-deploy-action:preview -->';
            const themeId = '${{ steps.preview.outputs.theme-id }}';
            const previewUrl = '${{ steps.preview.outputs.preview-url }}';
            const editorUrl = '${{ steps.preview.outputs.editor-url }}';
            const body = [
              marker,
              `<!-- theme-id:${themeId} -->`,
              '**Theme preview ready** for this PR:',
              `- [View storefront](${previewUrl})`,
              `- [Open in theme editor](${editorUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
